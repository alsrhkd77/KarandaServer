spring:
  application:
    name: "KarandaServer"
  profiles:
    active: "production"
  data:
    redis:
      repositories:
        enabled: false
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
  servlet:
    # Set utf-8
    encoding:
      charset: utf-8
      force: true

# Open API Swagger
springdoc:
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # ModelAndView를 반환하는 핸들러(Discord OAuth 리다이렉트 3종)도 문서에 포함한다.
  # 기본값(false)에서는 /auth/discord/authenticate/* 가 문서에서 통째로 빠진다.
  model-and-view-allowed: true

# Custom Properties (Immutable data)
karanda:
  adventurer-profile-url-base:
    kr: "https://www.kr.playblackdesert.com/ko-KR/Adventure/Profile"
    na: "https://www.naeu.playblackdesert.com/en-US/Adventure/Profile"
    eu: "https://www.naeu.playblackdesert.com/en-US/Adventure/Profile"
    jp: "https://www.jp.playblackdesert.com/ja-JP/Adventure/Profile"
  item-image:
    source-url-base: "https://s1.pearlcdn.com/KR/TradeMarket/Common/img/BDO/item/"
    bucket: "karanda"
    path-prefix: "bdo/item/image/"

---
# Production profile
spring:
  config:
    activate:
      on-profile: "production"
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}
    username: ${DB_USER}
    password: ${DB_PW}
    hikari:
      max-lifetime: 177000  # 177초
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  # Quartz 클러스터링 (Cloud Run 다중 컨테이너 대응)
  # 스키마는 수동 관리(src/main/resources/quartz/tables_mariadb.sql 1회 실행) → initialize-schema: never
  quartz:
    job-store-type: jdbc
    scheduler-name: karandaScheduler   # 클러스터 노드 간 동일해야 함
    overwrite-existing-jobs: true       # 배포 시 트리거 스케줄 변경 반영
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: "true"
      org.quartz.jobStore.clusterCheckinInterval: "20000"
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.scheduler.instanceId: AUTO   # 노드별 고유 ID 자동 부여 (클러스터링 필수)
server:
  port: 8080
management:
  server:
    port: 1234
  endpoints:
    enabled-by-default: false
    jmx:
      exposure:
        exclude: "*"


---
# Develop profile
spring:
  config:
    activate:
      on-profile: "develop"
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./localDB/dev
    username: user
    password: 1234
  jpa:
    hibernate:
      #ddl-auto: validate
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 20
server:
  port: 8000
